<!doctype html><html><head><meta charset="utf-8"><title>New Tab</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' https: data:; form-action https://duckduckgo.com">
<link rel="stylesheet" href="newtab.css"></head>
<body>
<div id="bar"><span id="edit-hint"></span>
  <button id="editBtn">Customize</button><button id="setBtn">Settings</button></div>
<div id="addbar" hidden>
  <b>Add widget:</b>
  <button data-add="clock">Clock</button><button data-add="search">Search</button><button data-add="quicklinks">Quick links</button>
  <button data-add="notes">Notes</button><button data-add="todo">To-do</button><button data-add="stats">Privacy stats</button>
  <button data-add="bookmarks">Bookmarks</button><button data-add="pomodoro">Pomodoro</button><button data-add="calc">Calculator</button>
  <span class="sp"></span>
  <label>Accent <input type="color" id="cAccent"></label><label>Background <input type="color" id="cBg"></label>
  <label>Cards <input type="color" id="cCard"></label><label>Corners <input type="range" id="cRad" min="0" max="28"></label>
  <label>Wallpaper URL <input id="cWall" placeholder="https://..." size="22"></label>
  <button id="resetBtn">Reset</button>
</div>
<main id="grid"></main>
<script src="calc.js"></script>
<script src="newtab.js"></script>
</body></html>
